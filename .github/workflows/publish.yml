name: Publish

on:
  push:
    branches: [main]

# Never let two publishes race; queue them instead of cancelling, so a run that
# is already talking to the registry is allowed to finish.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    # Named here because the npm trusted publisher is registered against this
    # environment; the OIDC claim must match it.
    environment:
      name: Production
      url: https://www.npmjs.com/package/iron-golem-ts
    permissions:
      contents: write # push the version tag
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Every push to main runs this workflow, but only a version bump should
      # publish. Re-publishing an existing version is rejected by the registry,
      # so check first and skip quietly instead of failing the run.
      - name: Decide whether to publish
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm - nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is new - will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm >= 11.5.1; the version bundled with Node
      # is not guaranteed to be recent enough.
      - name: Use a trusted-publishing capable npm
        if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      # Built explicitly rather than relying only on the `prepublishOnly` hook,
      # so that dropping that script cannot silently ship an empty package.
      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build

      # A tarball without the CLI still publishes successfully and breaks every
      # consumer, so check the contents before handing it to the registry.
      - name: Verify the tarball contains the built CLI
        if: steps.version.outputs.publish == 'true'
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const pack = require(process.env.RUNNER_TEMP + "/pack.json");
            // npm <= 11 emits an array; npm >= 12 emits an object keyed by package name.
            const entry = Array.isArray(pack) ? pack[0] : Object.values(pack)[0];
            if (!entry || !Array.isArray(entry.files)) {
              console.error("Unrecognized npm pack --json output shape.");
              process.exit(1);
            }
            const files = entry.files.map((f) => f.path);
            const missing = ["dist/index.js", "package.json"].filter((f) => !files.includes(f));
            if (missing.length > 0) {
              console.error("Missing from tarball: " + missing.join(", "));
              console.error("Tarball contains: " + files.join(", "));
              process.exit(1);
            }
            console.log("Tarball OK, " + files.length + " files.");
          '

      # Authenticated by OIDC via `id-token: write`, not by a token: tokens that
      # bypass 2FA are being withdrawn for direct publishing. Provenance is
      # generated automatically under trusted publishing.
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public

      - name: Tag the release
        if: steps.version.outputs.publish == 'true'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
